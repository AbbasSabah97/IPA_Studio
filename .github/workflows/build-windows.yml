name: Build IPA Studio Trusted v4 (Windows)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch PINNED iPASide source
        shell: pwsh
        run: .\packaging\FETCH-ENGINE.ps1
      - name: Apply strict signing and 2FA patches
        shell: pwsh
        run: .\packaging\PREPARE-TRUSTED.ps1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib mingw-w64-x86_64-minizip mingw-w64-x86_64-pkgconf
      - name: Build zsign with stdin password support
        shell: msys2 {0}
        run: |
          cd .upstream/ipaside
          bash tools/zsign/build-zsign.sh
          test -s src/iPASide.Engine/ipaside_engine/vendor/zsign.exe
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Test, build and package private engine
        shell: pwsh
        run: .\packaging\BUILD-TRUSTED.ps1 -Version 4.0.0 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: IPAStudio-Trusted-v4-Windows-Setup
          path: |
            dist/installer/IPAStudio-Trusted-Setup-4.0.0.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/build-dependencies.txt
          if-no-files-found: error
